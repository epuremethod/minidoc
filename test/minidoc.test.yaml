feature: Variable resolution
background:
  given: a filesystem
examples:
  - scenario: it should resolve variables from var
    source:
      config.yaml:
        var:
          name: Marmot
        build:
          - output: marmot.html
            input: |-
              Hello {{name}} !
    target:
      marmot.html: |-
        Hello Marmot !

  - scenario: it should prefer a build var over a global var
    source:
      config.yaml:
        var:
          name: Global
          planet: Earth
        build:
          -
            var:
              name: Local
            output: home.html
            input: |-
              {{name}} on {{planet}}
    target:
      home.html: |-
        Local on Earth

  - scenario: it should resolve variables whose values reference variables
    source:
      config.yaml:
        var:
          greeting: Hello {{name}}
          name: "{{animal}}"
          animal: Marmot
        build:
          - output: greeting.html
            input: |-
              {{greeting}} !
    target:
      greeting.html: |-
        Hello Marmot !

  - scenario: it should fail loud on an undefined variable
    source:
      config.yaml:
        var:
          name: Marmot
        build:
          -
            output: home.html
            input: |-
              Hello {{missing}} !
    error: 'Undefined variable {{missing}} in build[0] input'

  - scenario: it should detect a variable reference cycle
    source:
      config.yaml:
        var:
          a: "{{b}}"
          b: "{{a}}"
        build:
          - output: cycle.html
            input: |-
              {{a}}
    error: "Variable cycle in build[0] input: a -> b -> a"
