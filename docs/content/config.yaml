# llms.txt and llms-full.txt templates live in llms.yaml, shared with the
# package build (minidoc/llms.yaml) so the site and the npm package ship the
# same files.
base: llms.yaml
var:
  output: ../dist
  header: |-
    <header class="top">
        <a class="wordmark" href="#top" aria-label="minidoc — home">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="3" y="1.5" width="14" height="17" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 6h8M6 10h8M6 14h5" stroke="var(--accent)" stroke-width="1.5"/>
          </svg>
          minidoc <span class="fam">· épure</span>
        </a>
        <nav class="idx" aria-label="Chapters">
          {{navLinks}}
          <a href="./blocks.html">Blocks</a>
          <a href="#gallery">Built with</a>
          <a href="./llms.txt">llms.txt</a>
          <a href="https://github.com/epuremethod/minidoc">GitHub</a>
        </nav>
      </header>
  # The nav and the chapters below are two views of the same guide folder.
  navLinks:
    dir: guide
    each: '<a href="#{{slug}}">{{nav}}</a>'
    join: "\n        "
  chapters:
    dir: guide
    each: |-
      <section id="{{slug}}">
          <div class="sec-head">
            <div class="sec-kicker"><span class="no">{{no}}</span><span class="rule"></span><span class="tag">{{tag}}</span></div>
            <h2>{{title}}</h2>
          </div>
          <article class="doc">
      {{body}}
          </article>
        </section>
  footer: |-
    <footer class="titleblock">
        <div class="tb-row">
          <div class="tb-cell"><span class="lbl">Project</span><span class="val">MINIDOC — documentation, generated</span></div>
          <div class="tb-cell"><span class="lbl">Sheet</span><span class="val">{{sheet}}</span></div>
          <div class="tb-cell"><span class="lbl">Scale</span><span class="val">1 : 1</span></div>
          <div class="tb-cell"><span class="lbl">Date</span><span class="val">2026-09-23</span></div>
          <div class="tb-cell"><span class="lbl">Rev</span><span class="val">1</span></div>
        </div>
        <div class="tb-row crew">
          <div class="tb-cell"><span class="lbl">Drawn by</span><span class="val">Humans</span></div>
          <div class="tb-cell"><span class="lbl">Built by</span><span class="val">Itself</span></div>
          <div class="tb-cell"><span class="lbl">Reactive core</span><span class="val"><a href="https://tiliajs.dev">tilia</a></span></div>
          <div class="tb-cell"><span class="lbl">Notes</span><span class="val">Part of <a href="https://epuremethod.com">épure — drawn software</a></span></div>
        </div>
      </footer>
  shell: |
    <!doctype html>
    <html lang="en">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="alternate" type="text/markdown" href="./llms.txt" title="llms.txt — documentation index for LLMs">
    <link rel="alternate" type="text/markdown" href="./llms-full.txt" title="llms-full.txt — full documentation for LLMs">
    </head>
    <body>

    <div class="sheet" id="top">
      <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>

    {{header}}

      <main>
    {{main}}
      </main>

    {{footer}}
    </div>
    </body>
    </html>
  # The new layout: a contents column, a running head, one column of prose.
  # The Blocks page uses it; the other pages move to it next.
  pageShell: |
    <!doctype html>
    <html lang="en" data-blocks-theme="graphic">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="stylesheet" href="./site.css">
    <link rel="stylesheet" href="./blocks.css">
    <link rel="stylesheet" href="./themes/soft.css">
    <link rel="stylesheet" href="./themes/graphic.css">
    </head>
    <body>
    <aside class="contents" aria-label="Contents">
      <a class="brand" href="./index.html">minidoc <span class="brand__family">épure</span></a>
      <p class="contents__label">Contents</p>
      <ol class="contents__pages">
        <li><a href="./index.html">Guide</a></li>
        <li><a href="./blocks.html" aria-current="page">Blocks</a>
          <ol class="contents__sections">
          {{blocksToc}}
          </ol>
        </li>
      </ol>
      <footer class="contents__colophon">
        <a href="https://github.com/epuremethod/minidoc">github.com/epuremethod/minidoc</a>
        <span>Part of <a href="https://epuremethod.com">épure</a>. Built with minidoc and
        <a href="https://epurejs.dev">@epure/vitest</a>.</span>
      </footer>
    </aside>
    <main class="page">
      <p class="running-head"><span>minidoc</span><span>{{running}}</span></p>
      {{pageBody}}
    </main>
    <script>
    // The theme switch: it changes the drawn pages of the plates, not the site.
    (() => {
      const buttons = [...document.querySelectorAll("[data-theme-switch]")]
      const pick = (theme) => {
        for (const shot of document.querySelectorAll(".shot[data-blocks-theme]")) shot.dataset.blocksTheme = theme
        for (const button of buttons) button.setAttribute("aria-pressed", String(button.dataset.themeSwitch === theme))
        try { localStorage.setItem("minidoc-blocks-theme", theme) } catch {}
      }
      for (const button of buttons) button.addEventListener("click", () => pick(button.dataset.themeSwitch))
      let saved = null
      try { saved = localStorage.getItem("minidoc-blocks-theme") } catch {}
      if (saved === "soft" || saved === "graphic") pick(saved)
    })()
    </script>
    </body>
    </html>
  blocksToc:
    dir: blocks
    transform: none
    each: '<li><a href="#{{slug}}">{{nav}}</a></li>'
    join: "\n      "
  blocksSections:
    dir: blocks
    transform: blocksMd
    each: |-
      <section class="chapter" id="{{slug}}">
      <h2 class="chapter__title">{{title}}</h2>
      <div class="prose">
      {{body}}
      </div>
      {{sectionPlates}}
      </section>
  sectionPlates:
    value: "{{fixture}}"
    transform: plates
  themeSwitch: |-
    <div class="theme-switch" role="group" aria-label="Theme of the drawn pages">
      <span class="theme-switch__label">Theme</span>
      <button type="button" data-theme-switch="soft" aria-pressed="true">Soft</button>
      <button type="button" data-theme-switch="graphic" aria-pressed="false">Graphic</button>
    </div>
  hero:
    file: home.html
  gallery:
    file: gallery.html
  port: 54714
build:
  - output: "{{output}}/index.html"
    input: "{{shell}}"
    var:
      title: minidoc — a small documentation website generator
      description: "{{blurb}}"
      sheet: M-00 · Docs
      main: |-
        {{hero}}

        {{chapters}}

        {{gallery}}
  - output: "{{output}}/blocks.html"
    input: "{{pageShell}}"
    var:
      title: Blocks — minidoc
      description: "Common ::: blocks for minidoc sites, drawn from the package's own scenarios."
      running: Blocks
      pageBody: |-
        <header class="page-head">
        <h1 class="page-title">Blocks</h1>
        {{themeSwitch}}
        </header>
        {{blocksSections}}
  - output: "{{output}}/site.css"
    input:
      copy: ../assets/site.css
  - output: "{{output}}/blocks.css"
    input:
      copy: ../../blocks/blocks.css
  - output: "{{output}}/themes"
    input:
      copy: ../../blocks/themes
  - output: "{{output}}/llms.txt"
    input: "{{llmsTxt}}"
  - output: "{{output}}/llms-full.txt"
    input: "{{llmsFullTxt}}"
  - output: "{{output}}/styles.css"
    input:
      copy: ../assets/styles.css
  - output: "{{output}}/fonts"
    input:
      copy: ../assets/fonts
  - output: "{{output}}/shots"
    input:
      copy: ../assets/shots
