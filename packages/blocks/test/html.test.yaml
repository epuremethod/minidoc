feature: The HTML of each block
background:
  given: a page
examples:
  - scenario: a callout is an aside with its label above its body
    before: |-
      ::: note
      Keep each page **short**.
      :::
    after: |-
      <aside class="callout callout--note" aria-label="Note"><p class="callout__label">Note</p><div class="callout__body">
      <p>Keep each page <strong>short</strong>.</p>
      </div></aside>

  - scenario: a callout's author and date sit under its body
    before: |-
      ::: rejected "Ada Lovelace" 1843
      We keep the punched cards.
      :::
    after: |-
      <aside class="callout callout--rejected" aria-label="Rejected"><p class="callout__label">Rejected</p><div class="callout__body">
      <p>We keep the punched cards.</p>
      </div><p class="callout__by">— <cite>Ada Lovelace</cite>, <span class="callout__date">1843</span></p></aside>

  - scenario: a comment has no label, and its author and date head it on one line
    before: |-
      ::: comment "GB" 12.11
      Revoir avec le service.

      Une proposition de phrase.
      :::
    after: |-
      <aside class="callout callout--comment" aria-label="Comment"><p class="callout__by"><cite>GB</cite> · <span class="callout__date">12.11</span></p><div class="callout__body">
      <p>Revoir avec le service.</p>
      <p>Une proposition de phrase.</p>
      </div></aside>

  - scenario: a comment with no author and no date keeps its empty head, where its icon shows
    before: |-
      ::: comment
      Revoir.
      :::
    after: |-
      <aside class="callout callout--comment" aria-label="Comment"><p class="callout__by"></p><div class="callout__body">
      <p>Revoir.</p>
      </div></aside>

  - scenario: a quote is a figure with its author and date under it
    before: |-
      ::: quote "Ada Lovelace" 1843
      It weaves algebraic patterns.
      :::
    after: |-
      <figure class="quote"><blockquote>
      <p>It weaves algebraic patterns.</p>
      </blockquote><figcaption>— <cite>Ada Lovelace</cite>, <span class="quote__date">1843</span></figcaption></figure>

  - scenario: a named quote carries its name as its id
    before: |-
      ::: quote "Code civil, art. 1240" #cc-1240
      Tout fait quelconque de l'homme.
      :::
    after: |-
      <figure class="quote" id="cc-1240"><blockquote>
      <p>Tout fait quelconque de l'homme.</p>
      </blockquote><figcaption>— <cite>Code civil, art. 1240</cite></figcaption></figure>

  - scenario: a quote in the annexe leaves a link to its title, as a reference does
    before: |-
      ::: quote "Code civil, art. 1240" 2016 #cc-1240 annexe
      Tout fait quelconque de l'homme.
      :::

      Voir `(cc-1240)`.

      ::: annexe
      :::
    after: |-
      <p class="annexe__ref"><a href="#cc-1240">Code civil, art. 1240</a></p>
      <p>Voir <a href="#cc-1240">Code civil, art. 1240</a>.</p>
      <section class="annexe">
      <figure class="quote" id="cc-1240"><blockquote>
      <p>Tout fait quelconque de l'homme.</p>
      </blockquote><figcaption>— <cite>Code civil, art. 1240</cite>, <span class="quote__date">2016</span></figcaption></figure>
      </section>

  - scenario: a quote's source makes its title a link, and a reference still points at the quote
    before: |-
      ::: quote "Art. 10 al. 2 CPP" RS 312.0, état au 1er avril 2025 <https://www.fedlex.admin.ch/eli/cc/2010/267/fr?a=1&b=2#art_10> #cpp-10 annexe
      Le tribunal apprécie librement les preuves.
      :::

      Voir `(cpp-10)`.

      ::: annexe
      :::
    after: |-
      <p class="annexe__ref"><a href="#cpp-10">Art. 10 al. 2 CPP</a></p>
      <p>Voir <a href="#cpp-10">Art. 10 al. 2 CPP</a>.</p>
      <section class="annexe">
      <figure class="quote" id="cpp-10"><blockquote>
      <p>Le tribunal apprécie librement les preuves.</p>
      </blockquote><figcaption>— <cite><a href="https://www.fedlex.admin.ch/eli/cc/2010/267/fr?a=1&amp;b=2#art_10">Art. 10 al. 2 CPP</a></cite>, <span class="quote__date">RS 312.0, état au 1er avril 2025</span></figcaption></figure>
      </section>

  - scenario: a callout's source makes its author a link
    before: |-
      ::: rejected "Ada Lovelace" 1843 <https://example.org/notes>
      We keep the punched cards.
      :::
    after: |-
      <aside class="callout callout--rejected" aria-label="Rejected"><p class="callout__label">Rejected</p><div class="callout__body">
      <p>We keep the punched cards.</p>
      </div><p class="callout__by">— <cite><a href="https://example.org/notes">Ada Lovelace</a></cite>, <span class="callout__date">1843</span></p></aside>

  - scenario: a named callout carries its name as its id
    before: |-
      ::: rejected "Ada Lovelace" #cards
      We keep the punched cards.
      :::
    after: |-
      <aside class="callout callout--rejected" id="cards" aria-label="Rejected"><p class="callout__label">Rejected</p><div class="callout__body">
      <p>We keep the punched cards.</p>
      </div><p class="callout__by">— <cite>Ada Lovelace</cite></p></aside>

  - scenario: a flow is a callout holding columns of steps
    before: |-
      ::: flow
      1. **Upload**
         1. The file arrives
            - the original file
      :::
    after: |-
      <aside class="callout callout--flow" aria-label="Flow"><p class="callout__label">Flow</p><div class="callout__body">
      <ol class="flow">
      <li class="flow__column"><p class="flow__title">Upload</p>
      <ol class="flow__steps">
      <li class="flow__step"><p class="flow__text">The file arrives</p>
      <ul class="flow__details">
      <li>the original file</li>
      </ul>
      </li>
      </ol>
      </li>
      </ol>
      </div></aside>

  - scenario: a plan draws its stages as a band, then the todos under their stage
    before: |-
      ::: plan Plans in maia
      1. [x] **Fix the blocking bug** released
      2. [/] **Add a plan block** building
         - [x] Read the stages and their todos
         - [ ] Draw the band
      3. [ ] **Show plans in the maia MCP**
      :::
    after: |-
      <figure class="plan"><figcaption class="plan__title">Plans in maia</figcaption>
      <ol class="plan__stages">
      <li class="plan__stage plan__stage--done"><span class="plan__line"><span class="plan__number">1</span> <span class="plan__name">Fix the blocking bug</span></span><span class="plan__message">released</span></li>
      <li class="plan__stage plan__stage--doing"><span class="plan__line"><span class="plan__number">2</span> <span class="plan__name">Add a plan block</span></span><span class="plan__message">building</span></li>
      <li class="plan__stage"><span class="plan__line"><span class="plan__number">3</span> <span class="plan__name">Show plans in the maia MCP</span></span></li>
      </ol>
      <div class="plan__todos">
      <section class="plan__group plan__group--doing"><p class="plan__heading"><span class="plan__number">2</span> Add a plan block</p>
      <ul class="plan__list">
      <li class="plan__todo plan__todo--done">Read the stages and their todos</li>
      <li class="plan__todo">Draw the band</li>
      </ul>
      </section>
      </div>
      </figure>

  - scenario: a plan of todos only is their list
    before: |-
      ::: plan
      - [x] Update the changelog
      - [ ] Publish the package
      :::
    after: |-
      <figure class="plan">
      <ul class="plan__list">
      <li class="plan__todo plan__todo--done">Update the changelog</li>
      <li class="plan__todo">Publish the package</li>
      </ul>
      </figure>

  - scenario: a plan of more than four stages draws each stage as a button, and the stage in progress shows its todos
    before: |-
      ::: plan
      1. [x] **Fix the blocking bug** released
         - [x] Close the reload stream
      2. [/] **Add a plan block** building
         - [ ] Draw the band
      3. [ ] **Show plans in the maia MCP**
      4. [ ] **Move radif's plans into blocks**
      5. [ ] **Write the guide's chapter**
      :::
    after: |-
      <figure class="plan plan--long">
      <ol class="plan__stages" style="--plan-rows: 5">
      <li class="plan__item"><label class="plan__stage plan__stage--done"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">1</span> <span class="plan__name">Fix the blocking bug</span></span><span class="plan__message">released</span></label>
      <section class="plan__group plan__group--done"><p class="plan__heading"><span class="plan__number">1</span> Fix the blocking bug</p>
      <ul class="plan__list">
      <li class="plan__todo plan__todo--done">Close the reload stream</li>
      </ul>
      </section></li>
      <li class="plan__item"><label class="plan__stage plan__stage--doing"><input class="plan__pick" type="radio" name="plan-1" checked><span class="plan__line"><span class="plan__number">2</span> <span class="plan__name">Add a plan block</span></span><span class="plan__message">building</span></label>
      <section class="plan__group plan__group--doing"><p class="plan__heading"><span class="plan__number">2</span> Add a plan block</p>
      <ul class="plan__list">
      <li class="plan__todo">Draw the band</li>
      </ul>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">3</span> <span class="plan__name">Show plans in the maia MCP</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">3</span> Show plans in the maia MCP</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">4</span> <span class="plan__name">Move radif's plans into blocks</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">4</span> Move radif's plans into blocks</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">5</span> <span class="plan__name">Write the guide's chapter</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">5</span> Write the guide's chapter</p>
      </section></li>
      </ol>
      </figure>

  - scenario: each long plan of a page has its own buttons, and a plan with every stage done shows its last one
    before: |-
      ::: plan
      1. [x] One
      2. [x] Two
      3. [x] Three
      4. [x] Four
      5. [x] Five
      :::

      ::: plan
      1. [ ] One
      2. [ ] Two
      3. [ ] Three
      4. [ ] Four
      5. [ ] Five
      :::
    after: |-
      <figure class="plan plan--long">
      <ol class="plan__stages" style="--plan-rows: 5">
      <li class="plan__item"><label class="plan__stage plan__stage--done"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">1</span> <span class="plan__name">One</span></span></label>
      <section class="plan__group plan__group--done"><p class="plan__heading"><span class="plan__number">1</span> One</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage plan__stage--done"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">2</span> <span class="plan__name">Two</span></span></label>
      <section class="plan__group plan__group--done"><p class="plan__heading"><span class="plan__number">2</span> Two</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage plan__stage--done"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">3</span> <span class="plan__name">Three</span></span></label>
      <section class="plan__group plan__group--done"><p class="plan__heading"><span class="plan__number">3</span> Three</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage plan__stage--done"><input class="plan__pick" type="radio" name="plan-1"><span class="plan__line"><span class="plan__number">4</span> <span class="plan__name">Four</span></span></label>
      <section class="plan__group plan__group--done"><p class="plan__heading"><span class="plan__number">4</span> Four</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage plan__stage--done"><input class="plan__pick" type="radio" name="plan-1" checked><span class="plan__line"><span class="plan__number">5</span> <span class="plan__name">Five</span></span></label>
      <section class="plan__group plan__group--done"><p class="plan__heading"><span class="plan__number">5</span> Five</p>
      </section></li>
      </ol>
      </figure>
      <figure class="plan plan--long">
      <ol class="plan__stages" style="--plan-rows: 5">
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-2" checked><span class="plan__line"><span class="plan__number">1</span> <span class="plan__name">One</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">1</span> One</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-2"><span class="plan__line"><span class="plan__number">2</span> <span class="plan__name">Two</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">2</span> Two</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-2"><span class="plan__line"><span class="plan__number">3</span> <span class="plan__name">Three</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">3</span> Three</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-2"><span class="plan__line"><span class="plan__number">4</span> <span class="plan__name">Four</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">4</span> Four</p>
      </section></li>
      <li class="plan__item"><label class="plan__stage"><input class="plan__pick" type="radio" name="plan-2"><span class="plan__line"><span class="plan__number">5</span> <span class="plan__name">Five</span></span></label>
      <section class="plan__group"><p class="plan__heading"><span class="plan__number">5</span> Five</p>
      </section></li>
      </ol>
      </figure>

  - scenario: a screen draws its bar, its text and each kind of widget
    options:
      ui-dialog:
        owners:
          provider: Identity provider
    before: |-
      ::: ui-dialog provider Sign in
      Choose an account.

      ( ) Work
      (x) Personal

      [x] Remember me

      Password : ____

      [Cancel] [[Sign in]]*
      :::
    after: |-
      <div class="ui-dialog ui-dialog--provider" style="--tone: var(--tone-provider, var(--blocks-ink))" role="group" aria-label="Screen mockup: Sign in"><div class="ui-dialog__bar"><span class="ui-dialog__owner">Identity provider</span><span class="ui-dialog__title">Sign in</span></div><div class="ui-dialog__body">
      <p>Choose an account.</p>
      <div class="ui-dialog__options"><div class="ui-dialog__option ui-dialog__option--radio">Work</div><div class="ui-dialog__option ui-dialog__option--radio ui-dialog__option--on">Personal</div></div>
      <div class="ui-dialog__options"><div class="ui-dialog__option ui-dialog__option--check ui-dialog__option--on">Remember me</div></div>
      <div class="ui-dialog__field"><span class="ui-dialog__field-label">Password</span><span class="ui-dialog__input"></span></div>
      <div class="ui-dialog__actions"><span class="ui-dialog__button">Cancel</span><span class="ui-dialog__button ui-dialog__button--primary ui-dialog__button--clicked">Sign in</span></div>
      </div></div>

  - scenario: a form draws its fields with their values, lists and buttons
    before: |-
      ::: ui-form Application
      Name : "Portal"
      Format : "JSON" ▾
      Token : "a1b2c3" [Copy]
      :::
    after: |-
      <div class="ui-dialog ui-form" role="group" aria-label="Form mockup: Application"><div class="ui-dialog__bar"><span class="ui-dialog__title">Application</span></div><div class="ui-dialog__body">
      <div class="ui-dialog__field"><span class="ui-dialog__field-label">Name</span><span class="ui-dialog__input">Portal</span></div>
      <div class="ui-dialog__field"><span class="ui-dialog__field-label">Format</span><span class="ui-dialog__input ui-dialog__input--select">JSON</span></div>
      <div class="ui-dialog__field"><span class="ui-dialog__field-label">Token</span><span class="ui-dialog__control"><span class="ui-dialog__input">a1b2c3</span><span class="ui-dialog__button">Copy</span></span></div>
      </div></div>

  - scenario: a flow of screens is a figure with its caption above the screens
    before: |-
      :::: ui-flow Changing a password
      ::: ui-dialog Settings
      [[Change password]]*
      :::
      ::::
    after: |-
      <figure class="ui-flow"><figcaption class="ui-flow__caption">Changing a password</figcaption><div class="ui-flow__steps">
      <div class="ui-dialog" role="group" aria-label="Screen mockup: Settings"><div class="ui-dialog__bar"><span class="ui-dialog__title">Settings</span></div><div class="ui-dialog__body">
      <div class="ui-dialog__actions"><span class="ui-dialog__button ui-dialog__button--primary ui-dialog__button--clicked">Change password</span></div>
      </div></div>
      </div></figure>

  - scenario: an API call draws its call, its query after the path, and a list as cards
    options:
      api:
        labels:
          empty: Nothing
    before: |-
      ::: api GET /messages
      query
        app: portal
      response 200
        []
      response 200
        - id: 1
          code: "1950"
      :::
    after: |-
      <figure class="api" role="group" aria-label="GET /messages?app=portal"><div class="api__call"><span class="api__method">GET</span><code class="api__path">/messages<span class="api__search">?app=portal</span></code></div>
      <div class="api__part api__part--query"><p class="api__label">Query</p><dl class="api__fields"><div class="api__field"><dt>app</dt><dd><span class="api__string">portal</span></dd></div></dl></div>
      <div class="api__part api__part--response"><p class="api__label">Response <span class="api__status api__status--ok">200</span></p><p class="api__empty">Nothing <code>[]</code></p></div>
      <div class="api__part api__part--response"><p class="api__label">Response <span class="api__status api__status--ok">200</span></p><ol class="api__items"><li class="api__item"><dl class="api__fields"><div class="api__field"><dt>id</dt><dd><span class="api__number">1</span></dd></div><div class="api__field"><dt>code</dt><dd><span class="api__string">1950</span></dd></div></dl></li></ol></div>
      </figure>

  - scenario: a list of plain values is written on one line
    before: |-
      ::: api POST /apps
      body
        queries:
          - certificate
          - status
      :::
    after: |-
      <figure class="api" role="group" aria-label="POST /apps"><div class="api__call"><span class="api__method">POST</span><code class="api__path">/apps</code></div>
      <div class="api__part api__part--body"><p class="api__label">Body</p><dl class="api__fields"><div class="api__field"><dt>queries</dt><dd><span class="api__inline"><span class="api__string">certificate</span>, <span class="api__string">status</span></span></dd></div></dl></div>
      </figure>


  - scenario: a sequence is a figure holding an SVG, with its parties, their lives and the messages between them
    before: |-
      ::: sequence
      browser app
      browser -> app  sign in
      app -> browser  token
      :::
    after: |-
      <figure class="sequence"><svg class="sequence__svg" viewBox="-10 -10 252 134" width="252" height="134" role="img" aria-label="A sequence"><defs><marker id="sequence-tip" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="sequence__tip" d="M 0 0 L 14 5 L 0 10 L 3.8 5 z" /></marker><marker id="sequence-cross" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path class="sequence__cross" d="M 1.5 1.5 L 8.5 8.5 M 8.5 1.5 L 1.5 8.5" /></marker></defs><line class="sequence__life" x1="42" y1="26" x2="42" y2="114" /><line class="sequence__life" x1="190" y1="26" x2="190" y2="114" /><g class="sequence__head sequence__head--party"><rect x="0" y="0" width="84" height="26" rx="7" /><text x="42" y="17" text-anchor="middle">browser</text></g><g class="sequence__head sequence__head--party"><rect x="148" y="0" width="84" height="26" rx="7" /><text x="190" y="17" text-anchor="middle">app</text></g><path class="sequence__message" marker-end="url(#sequence-tip)" d="M 42 50 L 190 50" data-step="sign in" /><path class="sequence__message" marker-end="url(#sequence-tip)" d="M 190 82 L 42 82" data-step="token" /><text class="sequence__label" x="116" y="45" text-anchor="middle">sign in</text><text class="sequence__label" x="116" y="77" text-anchor="middle">token</text></svg></figure>

  - scenario: a state machine is a figure holding an SVG, with its boxes and the moves between them
    before: |-
      ::: states
      draft review published

      draft -> review  submit
      review -> published  approve
      :::
    after: |-
      <figure class="states"><svg class="states__svg" viewBox="-10 -25 320 65" width="320" height="65" role="img" aria-label="A state machine"><defs><marker id="states-tip" viewBox="0 0 14 10" refX="13" refY="5" markerWidth="14" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="states__tip" d="M 0 0 L 14 5 L 0 10 L 3.8 5 z" /></marker></defs><path class="states__move" marker-end="url(#states-tip)" d="M 55 15 C 89 15, 67 15, 91.2 15 L 101 15" data-move="submit" /><path class="states__move" marker-end="url(#states-tip)" d="M 170 15 C 204 15, 182 15, 206.2 15 L 216 15" data-move="approve" /><g class="states__box states__box--step"><rect x="0" y="0" width="55" height="30" rx="7" /><text x="27.5" y="19" text-anchor="middle">draft</text></g><g class="states__box states__box--step"><rect x="101" y="0" width="69" height="30" rx="7" /><text x="135.5" y="19" text-anchor="middle">review</text></g><g class="states__box states__box--step"><rect x="216" y="0" width="84" height="30" rx="7" /><text x="258" y="19" text-anchor="middle">published</text></g><text class="states__label" x="78" y="-3" text-anchor="middle">submit</text><text class="states__label" x="193" y="-3" text-anchor="middle">approve</text></svg></figure>

  - scenario: a model is a figure holding an SVG, with its tables and the relations between them
    before: |-
      ::: model
      Project Site

      Project
        id     uuid  p-0412
        title  text  School A

      Site
        id       uuid
        project  ref   p-0412

      Project --o< Site  sites
