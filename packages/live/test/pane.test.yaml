feature: A block's pane
background:
  given: a block's pane
examples:
  - scenario: what the person types is handed on, and the preview under the source follows it
    before: |-
      ::: note
      Keep each page short.
      :::
    typed: |-
      ::: note
      Keep each page **short**.
      :::
    after: |-
      <aside class="callout callout--note" aria-label="Note"><p class="callout__label">Note</p><div class="callout__body">
      <p>Keep each page <strong>short</strong>.</p>
      </div></aside>

  - scenario: a source minidoc refuses is still handed on, and shows the reason under it
    before: |-
      ::: plan
      1. [/] **Draw the band**
         - [ ] Pick the tones
      :::
    typed: |-
      ::: plan
      1. [x] **Draw the band**
         - [ ] Pick the tones
      :::
    error: "plan: an open todo in a done stage, line 3: Pick the tones"
