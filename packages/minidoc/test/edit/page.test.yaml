feature: A page's markdown in the editor
background:
  given: a page edited in place
examples:
  - scenario: a page read and written back unchanged is the same file, frontmatter included
    file: |
      ---
      title: One page
      refs: [config]
      ---

      Mara starts where every site starts: one page, on screen, with the
      right title.

      ### The layout

      - **The look.** You design one HTML layout,
        or have one designed.
      - **The words.**

      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML |

      ```sh
      pnpm add -D @epure/minidoc
      ```
    blocks:
      - "paragraph: Mara starts where every site starts: one page, on screen, with the right title."
      - "title 3: The layout"
      - "item: The look. You design one HTML layout, or have one designed."
      - "item: The words."
      - "minidoc: | Name | Does |"
      - "code sh: pnpm add -D @epure/minidoc"

  - scenario: a word changed in a paragraph keeps its line breaks after the same words, and nothing else moves
    file: |
      The layout is plain HTML. Where content will go, it holds a reference: a
      name between double braces.

      A second paragraph,
      wrapped short.
    edits:
      - replace: "Where content will go"
        with: "Wherever the words go"
    written: |
      The layout is plain HTML. Wherever the words go, it holds a reference: a
      name between double braces.

      A second paragraph,
      wrapped short.

  - scenario: a title and an item edited are written in their place, and the rest of the file stays as it was
    file: |
      ### What minidoc leaves to you

      - **The look.** You design one HTML layout, or have one designed, or
        start from a theme.
      - **The words.** You write them.
    edits:
      - replace: "leaves to you"
        with: "leaves to its author"
      - replace: "or have one designed,"
        with: "or have it designed,"
    written: |
      ### What minidoc leaves to its author

      - **The look.** You design one HTML layout, or have it designed, or
        start from a theme.
      - **The words.** You write them.

  - scenario: a table, a numbered list, a quote, a `####` title and a callout that holds one of them are each one block drawn by minidoc, a code block is the editor's, and a change through the panel is written in its place
    file: |
      #### Options

      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML |

      1. **Design** the layout first.
      2. **Install** minidoc.

      > A **context** is a tree of templates.
      > Own wins.

      ```js
      await dev({ glob: "content/config.yaml" })
      ```

      ::: note
      1. Mara keeps the dev server open.
      :::
    blocks:
      - "minidoc: #### Options"
      - "minidoc: | Name | Does |"
      - "minidoc: 1. **Design** the layout first."
      - "minidoc: > A **context** is a tree of templates."
      - "code js: await dev({ glob: \"content/config.yaml\" })"
      - "minidoc: ::: note"
    edits:
      - replace: "markdown to HTML"
        with: "markdown to HTML, with Prism"
      - replace: "Mara keeps"
        with: "Sam keeps"
    written: |
      #### Options

      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML, with Prism |

      1. **Design** the layout first.
      2. **Install** minidoc.

      > A **context** is a tree of templates.
      > Own wins.

      ```js
      await dev({ glob: "content/config.yaml" })
      ```

      ::: note
      1. Sam keeps the dev server open.
      :::

  - scenario: a plan is a block of its own, edited where it stands
    file: |
      ::: plan
      1. [/] **Draw the band**
         - [ ] Pick the tones
      :::
    blocks:
      - "plan: ::: plan"

  - scenario: a source minidoc refuses is not written, and the file keeps the last source that read
    file: |
      ```sequence
      browser app
      browser -> app  sign in
      ```
    edits:
      - replace: "sign in"
        with: "log in"
      - replace: "browser -> app"
        with: "browser -> bank"
    written: |
      ```sequence
      browser app
      browser -> app  log in
      ```

  - scenario: a new paragraph is written after a blank line, and a new item right after the item before it
    file: |
      Each chapter adds one idea.

      - One page.
    edits:
      - after: "Each chapter adds one idea."
        add: "paragraph: Read it in order once."
      - after: "One page."
        add: "item: A folder of chapters."
    written: |
      Each chapter adds one idea.

      Read it in order once.

      - One page.
      - A folder of chapters.

  - scenario: "`{{x}}` stays text"
    file: |
      The tab reads {{title}}, from the
      config.
    blocks:
      - "paragraph: The tab reads {{title}}, from the config."
    edits:
      - replace: "the config"
        with: "the page"
    written: |
      The tab reads {{title}}, from the
      page.

  - scenario: a code span that holds a backtick keeps its fence when another word of its paragraph is edited
    file: |
      `title` is itself a template: ``"{{`site`}} — dates, small"``. When the
      script runs, minidoc renders it.
    edits:
      - replace: "When the"
        with: "Each time the"
    written: |
      `title` is itself a template: ``"{{`site`}} — dates, small"``. Each time the
      script runs, minidoc renders it.

  - scenario: a callout is a start and the blocks in it, and read and written back unchanged it is the same file
    file: |
      Before.

      ::: note "Anna" 2026-11-07
      Mara keeps the dev server open,
      all day.
      :::

      After.
    blocks:
      - "paragraph: Before."
      - 'callout note "Anna" 2026-11-07'
      - "> paragraph: Mara keeps the dev server open, all day."
      - "paragraph: After."

  - scenario: a word changed in a callout keeps its line breaks, and nothing else moves
    file: |
      ::: proposed
      The page saves on its own,
      300 ms after the last key.

      - One file per section.
      - One editor per file.

      ### A title
      :::
    blocks:
      - "callout proposed"
      - "> paragraph: The page saves on its own, 300 ms after the last key."
      - "> item: One file per section."
      - "> item: One editor per file."
      - "> title 3: A title"
    edits:
      - replace: "page saves"
        with: "page writes"
    written: |
      ::: proposed
      The page writes on its own,
      300 ms after the last key.

      - One file per section.
      - One editor per file.

      ### A title
      :::

  - scenario: another kind, author or date changes the start line only
    file: |
      ::: note "Anna" 2026-11-07 #saving
      The page saves on its own.
      :::
    blocks:
      - 'callout note "Anna" 2026-11-07'
      - "> paragraph: The page saves on its own."
    edits:
      - replace: "::: note"
        with: "::: settled"
      - replace: "2026-11-07"
        with: "2026-11-08"
    written: |
      ::: settled "Anna" 2026-11-08 #saving
      The page saves on its own.
      :::

  - scenario: a callout that holds a table or a drawing, of a kind minidoc does not know, or with more than three colons, is one block drawn by minidoc
    file: |
      ::: note
      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML |
      :::

      ::: risk
      The page may lose a key.
      :::

      :::: note
      The page saves on its own.
      ::::

      ::: note
      ```sequence
      browser app
      browser -> app  sign in
      ```
      :::
    blocks:
      - "minidoc: ::: note"
      - "minidoc: ::: risk"
      - "minidoc: :::: note"
      - "minidoc: ::: note"

  - scenario: a callout the caret makes is written with its blocks between its start line and its close
    file: |
      Before.

      After.
    edits:
      - after: "Before."
        add: "callout: ::: note"
      - after: "::: note"
        add: "> paragraph: Mara keeps the dev server open."
      - after: "Mara keeps"
        add: "> item: One file per section."
      - after: "One file per section."
        add: "> item: One editor per file."
      - replace: "::: note"
        with: "::: note \"Anna\" 2026-11-07"
    written: |
      Before.

      ::: note "Anna" 2026-11-07
      Mara keeps the dev server open.

      - One file per section.
      - One editor per file.
      :::

      After.

  - scenario: a block that leaves a callout is written after its close
    file: |
      ::: note
      Mara keeps the dev server open.

      Sam closes it.
      :::

      After.
    edits:
      - replace: "> Sam closes it."
        with: "Sam closes it."
    written: |
      ::: note
      Mara keeps the dev server open.
      :::

      Sam closes it.

      After.

  - scenario: a block that enters a callout is written before its close
    file: |
      ::: note
      Mara keeps the dev server open.
      :::

      After.
    edits:
      - replace: "After."
        with: "> After."
    written: |
      ::: note
      Mara keeps the dev server open.

      After.
      :::

  - scenario: a code block is one block of the editor, and read and written back unchanged it is the same file
    file: |
      Install it.

      ```sh
      pnpm add -D @epure/minidoc

        indented,  with trailing spaces  
      ```

      ```
      no language
      ```
    blocks:
      - "paragraph: Install it."
      - "code sh: pnpm add -D @epure/minidoc /  /   indented,  with trailing spaces  "
      - "code : no language"

  - scenario: a line of code changed changes that line only, and the fence stays as it was written
    file: |
      ~~~~js
      await dev({ glob: "content/config.yaml" })
      await build()
      ~~~~
    edits:
      - replace: "await build()"
        with: "await build({ watch: true })"
    written: |
      ~~~~js
      await dev({ glob: "content/config.yaml" })
      await build({ watch: true })
      ~~~~

  - scenario: a drawing in a fence and a fence that does not close are each one block drawn by minidoc
    file: |
      ```sequence
      browser app
      browser -> app  sign in
      ```

      ```sh
      pnpm docs:dev
    blocks:
      - "minidoc: ```sequence"
      - "minidoc: ```sh"

  - scenario: a code block the caret makes is written after a blank line
    file: |
      Install it.
    edits:
      - after: "Install it."
        add: "code: ```sh\npnpm add -D @epure/minidoc\n```"
    written: |
      Install it.

      ```sh
      pnpm add -D @epure/minidoc
      ```

  - scenario: a callout that holds a code block is edited in place, and written back unchanged it is the same file
    file: |
      ::: note
      Run it once:

      ```sh
      pnpm docs:dev

      pnpm docs:edit-check
      ```
      :::
    blocks:
      - "callout note"
      - "> paragraph: Run it once:"
      - "> code sh: pnpm docs:dev /  / pnpm docs:edit-check"
    edits:
      - replace: "pnpm docs:edit-check"
        with: "pnpm check"
    written: |
      ::: note
      Run it once:

      ```sh
      pnpm docs:dev

      pnpm check
      ```
      :::
