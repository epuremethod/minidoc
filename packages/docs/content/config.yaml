# llms.txt and llms-full.txt templates live in llms.yaml, shared with the
# package build (core/llms.yaml) so the site and the npm package ship the
# same files.
base: llms.yaml
var:
  output: ../dist
  port: 54714

  # One layout for every page: a contents column, a running head, one column
  # of prose. Each page marks itself current and lists its own sections.
  current: ' aria-current="page"'
  guideCurrent: ""
  apiCurrent: ""
  blocksCurrent: ""
  guideNav: ""
  apiNav: ""
  blocksNav: ""
  pageShell: |
    <!doctype html>
    <html lang="en" data-blocks-theme="graphic">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{description}}">
    <title>{{title}}</title>
    <link rel="stylesheet" href="./site.css">
    <link rel="stylesheet" href="./blocks.css">
    <link rel="stylesheet" href="./themes/soft.css">
    <link rel="stylesheet" href="./themes/graphic.css">
    <link rel="alternate" type="text/markdown" href="./llms.txt" title="llms.txt — documentation index for LLMs">
    <link rel="alternate" type="text/markdown" href="./llms-full.txt" title="llms-full.txt — full documentation for LLMs">
    </head>
    <body>
    <aside class="contents" aria-label="Contents">
      <a class="brand" href="./index.html">minidoc <span class="brand__family">épure</span></a>
      <p class="contents__label">Contents</p>
      <ol class="contents__pages">
        <li><a href="./index.html"{{guideCurrent}}>Guide</a>{{guideNav}}</li>
        <li><a href="./api.html"{{apiCurrent}}>API</a>{{apiNav}}</li>
        <li><a href="./blocks.html"{{blocksCurrent}}>Blocks</a>{{blocksNav}}</li>
      </ol>
      <footer class="contents__colophon">
        <a href="https://github.com/epuremethod/minidoc">github.com/epuremethod/minidoc</a>
        <a href="./llms.txt">llms.txt</a>
        <span>Part of <a href="https://epuremethod.com">épure</a>. Built with minidoc and
        <a href="https://epurejs.dev">@epure/vitest</a>.</span>
      </footer>
    </aside>
    <main class="page">
      <p class="running-head"><span>minidoc</span><span>{{running}}</span></p>
      {{pageBody}}
    </main>
    <script>
    // The theme switch: it changes the drawn pages of the plates, not the site.
    (() => {
      const buttons = [...document.querySelectorAll("[data-theme-switch]")]
      const pick = (theme) => {
        for (const shot of document.querySelectorAll(".shot[data-blocks-theme]")) shot.dataset.blocksTheme = theme
        for (const button of buttons) button.setAttribute("aria-pressed", String(button.dataset.themeSwitch === theme))
        try { localStorage.setItem("minidoc-blocks-theme", theme) } catch {}
      }
      for (const button of buttons) button.addEventListener("click", () => pick(button.dataset.themeSwitch))
      let saved = null
      try { saved = localStorage.getItem("minidoc-blocks-theme") } catch {}
      if (saved === "soft" || saved === "graphic") pick(saved)
    })()
    </script>
    <script src="./viewer.js" defer></script>{{editScript}}
    </body>
    </html>

  # The dev page is the editor: `pnpm docs:dev` marks each file's body with
  # the file it comes from, and loads the editor. Any other build writes
  # nothing for these.
  editScript: { value: "", transform: editScript }
  editTo: { value: "", transform: editTo }
  guideEdit: { value: "content/guide/{{file.name}}", transform: editFrom }
  apiEdit: { value: "content/api/{{file.dir}}/{{file.name}}", transform: editFrom }
  blocksEdit: { value: "content/blocks/{{file.name}}", transform: editFrom }

  # The guide: one story, one file per chapter, read in order.
  guideToc:
    dir: guide
    transform: none
    each: '<li><a href="#{{slug}}">{{title}}</a></li>'
    join: "\n      "
  # A chapter names its figure in its frontmatter; most have none.
  figure: ""
  figureHtml:
    file: "figures/{{figure}}.html"
    optional: true
  refsBlock:
    list: refs
    each: '<a href="./api.html#{{item}}"><code>{{item}}</code></a>'
    join: ", "
    template: '<p class="chapter__refs"><span>Reference</span> {{body}}</p>'
  chapters:
    dir: guide
    each: |-
      <section class="chapter" id="{{slug}}">
      <h2 class="chapter__title">{{title}}</h2>
      {{figureHtml}}
      <div class="prose">
      {{guideEdit}}{{body}}{{editTo}}
      {{refsBlock}}
      </div>
      </section>
  gallery:
    file: gallery.html

  # The API: one file per entry, grouped by folder, flat to look things up.
  # Each group is two views of its folder: contents links and entries.
  apiLink: '<li><a href="#{{slug}}">{{name}}</a></li>'
  apiEntry: |-
      <article class="entry" id="{{slug}}">
      <header class="entry__head">
      <h3 class="entry__name"><a href="#{{slug}}">{{name}}</a></h3>
      <span class="entry__kind">{{kind}}</span>
      </header>
      <p class="entry__summary">{{summary}}</p>
      <div class="prose">
      <div class="entry__signature">{{signatureHtml}}</div>
      {{apiEdit}}{{body}}{{editTo}}
      </div>
      </article>
  signatureHtml:
    value: |-
      ```{{lang}}
      {{signature}}
      ```
    transform: md
  functionsToc: { dir: api/1-functions, transform: none, each: "{{apiLink}}" }
  functionsEntries: { dir: api/1-functions, each: "{{apiEntry}}" }
  configToc: { dir: api/2-config, transform: none, each: "{{apiLink}}" }
  configEntries: { dir: api/2-config, each: "{{apiEntry}}" }
  varsToc: { dir: api/3-vars, transform: none, each: "{{apiLink}}" }
  varsEntries: { dir: api/3-vars, each: "{{apiEntry}}" }
  buildToc: { dir: api/4-build, transform: none, each: "{{apiLink}}" }
  buildEntries: { dir: api/4-build, each: "{{apiEntry}}" }
  rulesToc: { dir: api/5-rules, transform: none, each: "{{apiLink}}" }
  rulesEntries: { dir: api/5-rules, each: "{{apiEntry}}" }
  typesToc: { dir: api/6-types, transform: none, each: "{{apiLink}}" }
  typesEntries: { dir: api/6-types, each: "{{apiEntry}}" }

  # The blocks: one file per kind, each with its plates.
  blocksToc:
    dir: blocks
    transform: none
    each: '<li><a href="#{{slug}}">{{nav}}</a></li>'
    join: "\n      "
  blocksSections:
    dir: blocks
    each: |-
      <section class="chapter" id="{{slug}}">
      <h2 class="chapter__title">{{title}}</h2>
      <div class="prose">
      {{blocksEdit}}{{body}}{{editTo}}
      </div>
      {{sectionPlates}}
      </section>
  sectionPlates:
    value: "{{fixture}}"
    transform: plates
  themeSwitch: |-
    <div class="theme-switch" role="group" aria-label="Theme of the drawn pages">
      <span class="theme-switch__label">Theme</span>
      <button type="button" data-theme-switch="soft" aria-pressed="true">Soft</button>
      <button type="button" data-theme-switch="graphic" aria-pressed="false">Graphic</button>
    </div>
build:
  - output: "{{output}}/index.html"
    input: "{{pageShell}}"
    var:
      title: Guide — minidoc
      description: "{{blurb}}"
      running: Guide
      guideCurrent: "{{current}}"
      guideNav: |-
        <ol class="contents__sections">
              {{guideToc}}
              <li><a href="#built-with">Built with minidoc</a></li>
              </ol>
      pageBody: |-
        <header class="page-head page-head--static">
        <h1 class="page-title">Guide</h1>
        </header>
        <p class="page-lead">minidoc, told as one story: a small library outgrows its README, and its
        maintainer builds a site. Each chapter adds one idea. Read it in order once; to look something
        up later, use the <a href="./api.html">API reference</a>.</p>
        {{chapters}}
        {{gallery}}
  - output: "{{output}}/api.html"
    input: "{{pageShell}}"
    var:
      title: API — minidoc
      description: "The minidoc reference: functions, config keys, var kinds, build entries, rules and types."
      running: API
      apiCurrent: "{{current}}"
      apiNav: |-
        <p class="contents__group">Functions</p>
              <ol class="contents__sections contents__sections--plain">{{functionsToc}}</ol>
              <p class="contents__group">Config</p>
              <ol class="contents__sections contents__sections--plain">{{configToc}}</ol>
              <p class="contents__group">Var kinds</p>
              <ol class="contents__sections contents__sections--plain">{{varsToc}}</ol>
              <p class="contents__group">Build</p>
              <ol class="contents__sections contents__sections--plain">{{buildToc}}</ol>
              <p class="contents__group">Rules</p>
              <ol class="contents__sections contents__sections--plain">{{rulesToc}}</ol>
              <p class="contents__group">Types</p>
              <ol class="contents__sections contents__sections--plain">{{typesToc}}</ol>
      pageBody: |-
        <header class="page-head page-head--static">
        <h1 class="page-title">API</h1>
        </header>
        <p class="page-lead">Everything minidoc exposes, one entry each: the signature, every field,
        the behavior, one example. For the ideas behind them, read the <a href="./index.html">guide</a>.</p>
        <section class="api-group" id="functions">
        <h2 class="chapter__title">Functions</h2>
        {{functionsEntries}}
        </section>
        <section class="api-group" id="config">
        <h2 class="chapter__title">Config</h2>
        {{configEntries}}
        </section>
        <section class="api-group" id="var-kinds">
        <h2 class="chapter__title">Var kinds</h2>
        {{varsEntries}}
        </section>
        <section class="api-group" id="build-entries">
        <h2 class="chapter__title">Build</h2>
        {{buildEntries}}
        </section>
        <section class="api-group" id="rules">
        <h2 class="chapter__title">Rules</h2>
        {{rulesEntries}}
        </section>
        <section class="api-group" id="types">
        <h2 class="chapter__title">Types</h2>
        {{typesEntries}}
        </section>
  - output: "{{output}}/blocks.html"
    input: "{{pageShell}}"
    var:
      title: Blocks — minidoc
      description: "Common ::: blocks for minidoc sites, drawn from the package's own scenarios."
      running: Blocks
      blocksCurrent: "{{current}}"
      blocksNav: |-
        <ol class="contents__sections">
              {{blocksToc}}
              </ol>
      pageBody: |-
        <header class="page-head">
        <h1 class="page-title">Blocks</h1>
        {{themeSwitch}}
        </header>
        {{blocksSections}}
  - output: "{{output}}/site.css"
    input:
      copy: ../assets/site.css
  - output: "{{output}}/blocks.css"
    input:
      copy: ../../blocks/blocks.css
  - output: "{{output}}/themes"
    input:
      copy: ../../blocks/themes
  - output: "{{output}}/viewer.js"
    input:
      copy: ../../blocks/viewer.js
  - output: "{{output}}/llms.txt"
    input: "{{llmsTxt}}"
  - output: "{{output}}/llms-full.txt"
    input: "{{llmsFullTxt}}"
  - output: "{{output}}/fonts"
    input:
      copy: ../assets/fonts
  - output: "{{output}}/shots"
    input:
      copy: ../assets/shots
