# The llms.txt index and llms-full.txt, rendered from the guide, the API and
# the blocks folders. Base of the site config (docs/content/config.yaml) and of the
# package build (core/llms.yaml): each declares its own outputs.
var:
  blurb: >-
    minidoc is a small documentation website generator from the épure toolset.
    YAML configs declare variables and build outputs; contexts are dictionaries
    of templates; you inherit formulas, not values. This site is built with it.
  # The same folders as the site, two more views each: the llms.txt index and
  # the full-text concatenation, so they can never drift from the site.
  llmsGuideLinks:
    dir: guide
    transform: none              # only the frontmatter is used
    each: "- [{{title}}](https://minidoc.dev/#{{slug}}): {{desc}}"
  llmsApiLinks:
    dir: api
    glob: "*/*.md"
    transform: none
    each: "- [{{name}}](https://minidoc.dev/api.html#{{slug}}): {{summary}}"
  # A blocks page has no summary of its own: its title says what it draws.
  llmsBlocksLinks:
    dir: blocks
    transform: none
    each: "- [{{title}}](https://minidoc.dev/blocks.html#{{slug}})"
  llmsGuide:
    dir: guide
    transform: none
    each: |-
      ## {{title}}

      {{body}}
    join: "\n\n"
  llmsApi:
    dir: api
    glob: "*/*.md"
    transform: none
    each: |-
      ## {{name}}

      {{summary}}

      ```{{lang}}
      {{signature}}
      ```

      {{body}}
    join: "\n\n"
  # The prose of each blocks page; its plates are the package's fixtures, in
  # packages/blocks/test, and stay out.
  llmsBlocks:
    dir: blocks
    transform: none
    each: |-
      ## {{title}}

      {{body}}
    join: "\n\n"
  llmsTxt: |-
    # minidoc

    > {{blurb}}

    The guide tells minidoc as one story, in order; the API reference has one
    entry for each function, config key, var kind, build entry, rule and type;
    the blocks pages describe `@epure/blocks`, the `:::` blocks a site
    adds with one transform. The complete documentation as one markdown file is in
    [llms-full.txt](https://minidoc.dev/llms-full.txt).

    ## Guide

    {{llmsGuideLinks}}

    ## API

    {{llmsApiLinks}}

    ## Blocks

    {{llmsBlocksLinks}}

    ## Optional

    - [Example setup](https://github.com/epuremethod/minidoc/tree/main/packages/docs): this site's source — layout, config, build, dev
    - [llms-full.txt](https://minidoc.dev/llms-full.txt): the full guide, API and blocks, one markdown file
    - [Blocks scenarios](https://github.com/epuremethod/minidoc/tree/main/packages/blocks/test): each block's markdown and what it reads and draws
    - [GitHub](https://github.com/epuremethod/minidoc): source, issues, releases
  llmsFullTxt: |-
    # minidoc — full documentation

    > {{blurb}}

    # Guide

    {{llmsGuide}}

    # API

    {{llmsApi}}

    # Blocks

    {{llmsBlocks}}
