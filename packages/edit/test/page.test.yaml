feature: A page's markdown in the editor
background:
  given: a page edited in place
examples:
  - scenario: a page read and written back unchanged is the same file, frontmatter included
    file: |
      ---
      title: One page
      refs: [config]
      ---

      Mara starts where every site starts: one page, on screen, with the
      right title.

      ### The layout

      - **The look.** You design one HTML layout,
        or have one designed.
      - **The words.**

      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML |

      ```sh
      pnpm add -D @minidoc/core
      ```
    blocks:
      - "paragraph: Mara starts where every site starts: one page, on screen, with the right title."
      - "title 3: The layout"
      - "item: The look. You design one HTML layout, or have one designed."
      - "item: The words."
      - "minidoc: | Name | Does |"
      - "minidoc: ```sh"

  - scenario: a word changed in a paragraph keeps its line breaks after the same words, and nothing else moves
    file: |
      The layout is plain HTML. Where content will go, it holds a reference: a
      name between double braces.

      A second paragraph,
      wrapped short.
    edits:
      - replace: "Where content will go"
        with: "Wherever the words go"
    written: |
      The layout is plain HTML. Wherever the words go, it holds a reference: a
      name between double braces.

      A second paragraph,
      wrapped short.

  - scenario: a title and an item edited are written in their place, and the rest of the file stays as it was
    file: |
      ### What minidoc leaves to you

      - **The look.** You design one HTML layout, or have one designed, or
        start from a theme.
      - **The words.** You write them.
    edits:
      - replace: "leaves to you"
        with: "leaves to its author"
      - replace: "or have one designed,"
        with: "or have it designed,"
    written: |
      ### What minidoc leaves to its author

      - **The look.** You design one HTML layout, or have it designed, or
        start from a theme.
      - **The words.** You write them.

  - scenario: a table, a numbered list, a quote, a `####` title, a code block and a `:::` block are each one block drawn by minidoc, and a change through the panel is written in its place
    file: |
      #### Options

      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML |

      1. **Design** the layout first.
      2. **Install** minidoc.

      > A **context** is a tree of templates.
      > Own wins.

      ```js
      await dev({ glob: "content/config.yaml" })
      ```

      ::: note
      Mara keeps the dev server open.
      :::
    blocks:
      - "minidoc: #### Options"
      - "minidoc: | Name | Does |"
      - "minidoc: 1. **Design** the layout first."
      - "minidoc: > A **context** is a tree of templates."
      - "minidoc: ```js"
      - "minidoc: ::: note"
    edits:
      - replace: "markdown to HTML"
        with: "markdown to HTML, with Prism"
      - replace: "Mara keeps"
        with: "Sam keeps"
    written: |
      #### Options

      | Name | Does |
      | --- | --- |
      | `md` | markdown to HTML, with Prism |

      1. **Design** the layout first.
      2. **Install** minidoc.

      > A **context** is a tree of templates.
      > Own wins.

      ```js
      await dev({ glob: "content/config.yaml" })
      ```

      ::: note
      Sam keeps the dev server open.
      :::

  - scenario: a plan is a block of its own, edited where it stands
    file: |
      ::: plan
      1. [/] **Draw the band**
         - [ ] Pick the tones
      :::
    blocks:
      - "plan: ::: plan"

  - scenario: a source minidoc refuses is not written, and the file keeps the last source that read
    file: |
      ```sequence
      browser app
      browser -> app  sign in
      ```
    edits:
      - replace: "sign in"
        with: "log in"
      - replace: "browser -> app"
        with: "browser -> bank"
    written: |
      ```sequence
      browser app
      browser -> app  log in
      ```

  - scenario: a new paragraph is written after a blank line, and a new item right after the item before it
    file: |
      Each chapter adds one idea.

      - One page.
    edits:
      - after: "Each chapter adds one idea."
        add: "paragraph: Read it in order once."
      - after: "One page."
        add: "item: A folder of chapters."
    written: |
      Each chapter adds one idea.

      Read it in order once.

      - One page.
      - A folder of chapters.

  - scenario: "`{{x}}` stays text"
    file: |
      The tab reads {{title}}, from the
      config.
    blocks:
      - "paragraph: The tab reads {{title}}, from the config."
    edits:
      - replace: "the config"
        with: "the page"
    written: |
      The tab reads {{title}}, from the
      page.
