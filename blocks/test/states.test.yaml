feature: State machines
background:
  given: a document
examples:
  - scenario: the grid places the boxes, and the lines after it are the moves between them
    before: |-
      ```states
      draft review published

      draft -> review  submit
      review -> published  approve
      ```
    after: |-
      states
        frame -10 -19 320 59
        box step 0 0 55 30 "draft"
        box step 101 0 69 30 "review"
        box step 216 0 84 30 "published"
        move 55 15 89 15 67 15 101 15
          label 78 3 middle "submit"
        move 170 15 204 15 182 15 216 15
          label 193 3 middle "approve"

  - scenario: a move between rows curves, and a dot leaves a cell empty
    before: |-
      ```states Review
      draft review
      . rejected

      draft -> review  submit
      review -> rejected  refuse
      rejected -> draft  rework
      ```
    after: |-
      states
        frame -10 -19 206.82 173
        box step 0 0 55 30 "draft"
        box step 101 0 75 30 "review"
        box step 101 114 75 30 "rejected"
        move 55 15 89 15 67 15 101 15
          label 78 3 middle "submit"
        move 138.5 30 138.5 68.22 151 75.78 151 114
          label 155 73 start "refuse"
        move 126 114 126 55.75 27.5 88.25 27.5 30
          label 74 92 middle "rework"
        caption "Review"

  - scenario: a move to a box that the grid does not hold is refused
    before: |-
      ```states
      draft review

      draft -> published  publish
      ```
    error: "states: no box called published"

  - scenario: a box is marked with a kind of the project's, and the legend names the kinds
    options:
      states:
        kinds:
          decision: a decision
          end: an end
    before: |-
      ```states Review
      draft review:decision published:end
      . rejected:end
      {legend}

      draft -> review  submit
      review -> published  approve
      review -> rejected  refuse
      ```
    after: |-
      states
        frame -10 -19 326 173
        box step 0 0 55 30 "draft"
        box decision 101 0 75 30 "review"
        box end 222 0 84 30 "published"
        box end 101 114 75 30 "rejected"
        move 55 15 89 15 67 15 101 15
          label 78 3 middle "submit"
        move 176 15 210 15 188 15 222 15
          label 199 3 middle "approve"
        move 138.5 30 138.5 67.8 138.5 76.2 138.5 114
          label 150 76 start "refuse"
        caption "Review"
        key step "a step"
        key decision "a decision"
        key end "an end"

  - scenario: a move is marked with a kind in its braces, beside where its label sits
    options:
      states:
        kinds:
          fail: a refusal
    before: |-
      ```states
      draft review
      . rejected
      {legend}

      draft -> review  submit
      review -> rejected  refuse {fail}
      rejected -> draft  rework {0.4 fail}
      ```
    after: |-
      states
        frame -10 -19 206.82 173
        box step 0 0 55 30 "draft"
        box step 101 0 75 30 "review"
        box step 101 114 75 30 "rejected"
        move 55 15 89 15 67 15 101 15
          label 78 3 middle "submit"
        move fail 138.5 30 138.5 68.22 151 75.78 151 114
          label 155 73 start "refuse"
        move fail 126 114 126 55.75 27.5 88.25 27.5 30
          label 88 96 middle "rework"
        key step "a step"
        key fail "a refusal" move

  - scenario: a move marked with a kind the project does not declare is refused
    before: |-
      ```states
      draft review

      draft -> review  submit {oops}
      ```
    error: "states: no kind called oops, line 3"
